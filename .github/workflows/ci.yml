name: Code CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A green run takes a few minutes; this ends a hang the test timeouts miss.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24.16.0
          cache: true
          install: true

      - name: Set up Bun for native TUI tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The contract tests drive the real TUI, so they need the CLI of the pinned @opencode/sdk.
      # It goes under the runner's temp directory so nothing global changes. npm 12 skips install
      # scripts by default, so the postinstall that links the platform binary runs explicitly.
      - name: Install the OpenCode CLI the plugin is pinned to
        shell: bash
        run: |
          version=$(node -p "require('./package.json').devDependencies['@opencode/sdk']")
          cli="$RUNNER_TEMP/opencode/node_modules/@opencode/cli"
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/opencode" "@opencode/cli@$version"
          node "$cli/postinstall.mjs"
          echo "OPENCODE_BIN=$cli/bin/opencode.exe" >> "$GITHUB_ENV"

      - name: Check
        run: pnpm check
