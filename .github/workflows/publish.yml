name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify stable release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          node --input-type=module -e "import packageJson from './package.json' with { type: 'json' };
          process.exit(process.env.RELEASE_TAG === 'v' + packageJson.version &&
          /^\d+\.\d+\.\d+$/.test(packageJson.version) ? 0 : 1)"

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24.16.0
          cache: false
          install: true

      - name: Set up Bun for native TUI tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Same as ci.yml: the contract tests in `pnpm check` drive the real TUI.
      - name: Install the OpenCode CLI the plugin is pinned to
        shell: bash
        run: |
          version=$(node -p "require('./package.json').devDependencies['@opencode/sdk']")
          cli="$RUNNER_TEMP/opencode/node_modules/@opencode/cli"
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/opencode" "@opencode/cli@$version"
          node "$cli/postinstall.mjs"
          echo "OPENCODE_BIN=$cli/bin/opencode.exe" >> "$GITHUB_ENV"

      - name: Check
        run: pnpm check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: NPM Registry
      url: https://www.npmjs.com/package/opencode-super-sessions

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24.16.0
          cache: false
          install: true

      - name: Publish to NPM
        run: npx --yes npm@latest publish --access public
